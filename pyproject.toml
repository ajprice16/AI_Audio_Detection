[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiaa"
version = "1.2.1"
description = "AIAA: AI Audio Authenticity - Machine learning system for detecting AI-generated audio using Benford's Law and advanced spectral features"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alex Price", email = "ajprice@mail.wlu.edu"},
]
keywords = ["ai", "detection", "audio", "machine-learning", "benford-law", "audio-analysis", "authenticity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "librosa>=0.9.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.62.0",
    "joblib>=1.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "coverage>=6.0",
    "flake8>=5.0.0",
    "flake8-docstrings>=1.6.0",
    "flake8-import-order>=0.18.1",
    "black>=22.0.0",
    "mypy>=0.990",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.32.0",
    "bandit>=1.7.0",
    "safety>=2.0.0",
    "pre-commit>=2.20.0",
    "soundfile>=0.12.0",
    "pytest-benchmark>=4.0.0",
    "memory-profiler>=0.60.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.19.0",
]
test = [
    "hypothesis>=6.0.0",
    "factory-boy>=3.2.0",
    "soundfile>=0.12.0",
]

[project.urls]
"Homepage" = "https://github.com/ajprice16/AI_Audio_Detection"
"Bug Reports" = "https://github.com/ajprice16/AI_Audio_Detection/issues"
"Source" = "https://github.com/ajprice16/AI_Audio_Detection"
"Documentation" = "https://github.com/ajprice16/AI_Audio_Detection#readme"

[project.scripts]
aiaa = "aiaa:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiaa*"]
exclude = ["tests*"]

[tool.black]
line-length = 127
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | models
  | results
  | spectrograms
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: mark test as slow running",
    "integration: mark test as integration test",
    "unit: mark test as unit test",
    "benchmark: mark test as benchmark",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["aiaa"]
omit = [
    "tests/*",
    "setup.py",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "env", ".env"]
skips = ["B110", "B112", "B311", "B404", "B602"]

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
